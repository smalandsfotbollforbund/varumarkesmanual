<svg width="640" height="420" viewBox="0 0 640 420" role="img" xmlns="http://www.w3.org/2000/svg">
<title>SmFF emblem – placeringsregler</title>
<desc>Illustration av korrekt placering av SmFF:s emblem på stående format (affisch, slide), liggande format (banderoll) och samprofilering med SvFF</desc>
<rect width="640" height="420" fill="#FFFFFF"/>

<text x="24" y="28" font-family="system-ui,sans-serif" font-size="10" font-weight="500" fill="#888" letter-spacing="0.1em">PLACERING – STÅENDE FORMAT</text>

<!-- Affisch primär placering -->
<g transform="translate(24,44)">
  <rect width="120" height="168" rx="6" fill="#F9F9F9" stroke="#E0E0E0" stroke-width="0.5"/>
  <rect x="10" y="10" width="100" height="12" rx="2" fill="#DDDDDD"/>
  <rect x="10" y="30" width="80" height="8" rx="2" fill="#E8E8E8"/>
  <rect x="10" y="46" width="92" height="8" rx="2" fill="#E8E8E8"/>
  <rect x="10" y="62" width="72" height="8" rx="2" fill="#E8E8E8"/>
  <circle cx="97" cy="143" r="18" fill="#A91C1C"/>
  <circle cx="97" cy="143" r="14" fill="none" stroke="white" stroke-width="0.8"/>
  <text x="97" y="147" text-anchor="middle" font-size="10" fill="white">🦁</text>
  <rect x="10" y="154" width="76" height="6" rx="2" fill="#E8E8E8"/>
  <text x="60" y="188" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#333">Nedre höger</text>
  <text x="60" y="204" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#A91C1C">Primärt</text>
</g>

<!-- Affisch sekundär placering -->
<g transform="translate(164,44)">
  <rect width="120" height="168" rx="6" fill="#F9F9F9" stroke="#E0E0E0" stroke-width="0.5"/>
  <rect x="10" y="10" width="100" height="12" rx="2" fill="#DDDDDD"/>
  <rect x="10" y="30" width="80" height="8" rx="2" fill="#E8E8E8"/>
  <rect x="10" y="46" width="92" height="8" rx="2" fill="#E8E8E8"/>
  <rect x="10" y="62" width="72" height="8" rx="2" fill="#E8E8E8"/>
  <circle cx="23" cy="143" r="18" fill="#A91C1C"/>
  <circle cx="23" cy="143" r="14" fill="none" stroke="white" stroke-width="0.8"/>
  <text x="23" y="147" text-anchor="middle" font-size="10" fill="white">🦁</text>
  <rect x="44" y="154" width="68" height="6" rx="2" fill="#E8E8E8"/>
  <text x="60" y="188" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#333">Nedre vänster</text>
  <text x="60" y="204" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#666">Sekundärt</text>
</g>

<!-- Skyltmaterial centrerat -->
<g transform="translate(304,44)">
  <rect width="120" height="168" rx="6" fill="#A91C1C"/>
  <circle cx="60" cy="84" r="44" fill="white" opacity="0.95"/>
  <circle cx="60" cy="84" r="35" fill="none" stroke="#A91C1C" stroke-width="1.5"/>
  <text x="60" y="55" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#A91C1C" letter-spacing="1.5">SMÅLANDS</text>
  <text x="60" y="115" text-anchor="middle" font-family="system-ui,sans-serif" font-size="6.5" font-weight="700" fill="#A91C1C" letter-spacing="0.8">FOTBOLLFÖRBUND</text>
  <text x="60" y="94" text-anchor="middle" font-size="26" fill="#A91C1C">🦁</text>
  <text x="60" y="188" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#333">Centrerat</text>
  <text x="60" y="204" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#666">Skylt, flagga, podie</text>
</g>

<text x="444" y="72" font-family="system-ui,sans-serif" font-size="10" font-weight="500" fill="#888" letter-spacing="0.1em">PROPORTIONSREGEL</text>

<!-- Proportionsregel -->
<g transform="translate(444,84)">
  <rect width="192" height="68" rx="6" fill="#F9F9F9" stroke="#E0E0E0" stroke-width="0.5"/>
  <!-- bakgrundsstapel -->
  <rect x="8" y="24" width="176" height="20" rx="3" fill="#EEEEEE"/>
  <!-- 15% segment -->
  <rect x="8" y="24" width="26" height="20" rx="3" fill="#A91C1C" opacity="0.2"/>
  <circle cx="21" cy="34" r="9" fill="#A91C1C"/>
  <text x="21" y="38" text-anchor="middle" font-size="5" fill="white">🦁</text>
  <text x="97" y="18" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#555">Emblematiken = 15 % av längsta mått</text>
  <text x="21" y="56" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A91C1C">15 %</text>
  <text x="110" y="56" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#999">85 %</text>
</g>

<line x1="24" y1="230" x2="616" y2="230" stroke="#E0E0E0" stroke-width="0.5"/>

<text x="24" y="254" font-family="system-ui,sans-serif" font-size="10" font-weight="500" fill="#888" letter-spacing="0.1em">LIGGANDE FORMAT – BANDEROLL</text>

<!-- Banderoll primär -->
<g transform="translate(24,270)">
  <rect width="280" height="88" rx="6" fill="#F9F9F9" stroke="#E0E0E0" stroke-width="0.5"/>
  <rect x="10" y="10" width="240" height="10" rx="2" fill="#DDDDDD"/>
  <rect x="10" y="28" width="180" height="8" rx="2" fill="#E8E8E8"/>
  <circle cx="252" cy="44" r="30" fill="#A91C1C"/>
  <circle cx="252" cy="44" r="24" fill="none" stroke="white" stroke-width="1"/>
  <text x="252" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" font-weight="700" fill="white" letter-spacing="1.2">SMÅLANDS</text>
  <text x="252" y="63" text-anchor="middle" font-family="system-ui,sans-serif" font-size="6" font-weight="700" fill="white" letter-spacing="0.6">FOTBOLLFÖRBUND</text>
  <text x="252" y="50" text-anchor="middle" font-size="18" fill="white">🦁</text>
  <text x="140" y="106" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#333">Höger sida, centrerat vertikalt</text>
</g>

<!-- Banderoll dubbel logotyp -->
<g transform="translate(320,270)">
  <rect width="296" height="88" rx="6" fill="#F9F9F9" stroke="#E0E0E0" stroke-width="0.5"/>
  <circle cx="30" cy="44" r="24" fill="#A91C1C"/>
  <circle cx="30" cy="44" r="19" fill="none" stroke="white" stroke-width="0.8"/>
  <text x="30" y="48" text-anchor="middle" font-size="13" fill="white">🦁</text>
  <rect x="64" y="16" width="168" height="10" rx="2" fill="#DDDDDD"/>
  <rect x="64" y="34" width="132" height="8" rx="2" fill="#E8E8E8"/>
  <rect x="64" y="50" width="148" height="8" rx="2" fill="#E8E8E8"/>
  <circle cx="266" cy="44" r="24" fill="#A91C1C"/>
  <circle cx="266" cy="44" r="19" fill="none" stroke="white" stroke-width="0.8"/>
  <text x="266" y="48" text-anchor="middle" font-size="13" fill="white">🦁</text>
  <text x="148" y="106" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#666">Dubbel logotyp vid kort textbudskap</text>
</g>

</svg>
